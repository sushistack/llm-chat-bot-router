<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LLM Router — Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="container">
    <h1>LLM Router Options</h1>
    <p class="hint">Manage the tabs shown in the sidebar. Changes apply immediately.</p>

    <ul class="tab-list" id="tab-list" aria-live="polite"></ul>

    <section class="add-row" aria-label="Add a new tab">
      <h2>Add tab</h2>
      <form id="add-form" novalidate>
        <label>
          Label
          <input type="text" id="add-label" required maxlength="40" placeholder="e.g. Perplexity">
        </label>
        <label>
          URL
          <input type="url" id="add-url" required placeholder="https://...">
        </label>
        <button type="submit">Add</button>
        <p class="error" id="add-error" hidden></p>
      </form>
    </section>

  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
